<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Demander un devis d'élagage</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <h1>Demander un devis d'élagage en Médoc</h1>
    <p><strong>Ce site est un service de mise en relation.</strong>
    Nous ne réalisons pas les travaux : votre demande est transmise
    à un élagueur partenaire indépendant.</p>

    <form action="https://api.web3forms.com/submit" method="POST">
      <input type="hidden" name="access_key" value="ac74fa86-cf94-44b8-9bf4-1196241b149a">
      <input type="hidden" name="subject" value="Nouveau lead - Élagage Médoc">
      <input type="hidden" name="from_name" value="Site Élagage Médoc">
      <input type="hidden" name="redirect" value="https://zorizebs.github.io/devis-elagage-medoc/merci.html">
      <input type="checkbox" name="botcheck" style="display:none">

      <label>Prénom <input type="text" name="prenom" required></label>
      <label>Nom <input type="text" name="nom" required></label>
      <label>Téléphone <input type="tel" name="telephone" required></label>
      <label>Description du projet <textarea name="description" required></textarea></label>

      <label>
        <input type="checkbox" name="consentement" required>
        J'accepte que mes données soient transmises à un professionnel partenaire
        pour me recontacter.
        <a href="politique-confidentialite.html">En savoir plus</a>
      </label>

      <button type="submit">Demander un devis</button>
    </form>
  </main>
</body>
</html>
